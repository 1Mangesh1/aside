<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aside panel</title>
<style>
  /* The color tokens are defined in index.html. Keep these two lines the same as there. */
  :root { --bg:#f7f6f3; --panel:#fff; --ink:#1d1d1f; --quiet:#66666c; --line:#e3e1dc; --accent:#c4501b; --ok:#2f7d4f; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151515; --panel:#1e1e1e; --ink:#ecebe8; --quiet:#a3a3a8; --line:#2f2f2f; --accent:#e0703e; --ok:#5fb37f; --bad:#ef6b62; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { flex: none; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 12px; border-bottom: 1px solid var(--line); }
  #dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--quiet); } #dot.on { background: var(--bad); }
  #clock { font-weight: 600; font-variant-numeric: tabular-nums; }
  #title, .line { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } #title { flex: 1; color: var(--quiet); }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; }
  button { font: inherit; min-height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; } button:disabled { opacity: .45; cursor: default; }
  input { width: 100%; height: 28px; font: inherit; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
  fieldset { display: flex; gap: 6px; border: 0; padding: 0; margin: 6px 0 0; min-width: 0; }
  p { margin: 0; } .quiet { color: var(--quiet); } .err { color: var(--bad); } .err:empty, #answer:empty { display: none; }
  #live { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  /* Newest line at the bottom: a line that does not fit is cut off at the top, behind a fade. */
  #transcript { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; mask-image: linear-gradient(transparent, #000 18px); }
  #transcript p { flex: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } .who { color: var(--quiet); margin-right: 6px; }
  #answer { max-height: 4.2em; overflow-y: auto; margin-top: 6px; white-space: pre-wrap; }
  .hidden { display: none !important; }
  body.collapsed main, body.collapsed #title, body.collapsed #fold { display: none; } body.collapsed header { border: 0; cursor: pointer; }
</style>
</head>
<body>
<header id="bar"><span id="dot"></span><span id="clock"></span><span id="title">aside</span><button id="fold">Hide</button></header>
<main>
  <div class="quiet" id="idle">Not recording</div>
  <div class="hidden" id="start"><p id="startText"></p>
    <fieldset id="startBtns"><button data-claude="local">Local only</button><button class="primary" data-claude="allowed">Claude allowed</button><button id="notNow">Not now</button></fieldset></div>
  <div class="hidden" id="ending"><p id="endText"></p>
    <fieldset id="stopBtns"><button class="primary" id="stopNow">Stop now</button><button id="keep">Keep recording</button></fieldset></div>
  <div class="err line" id="err"></div>
  <div class="hidden" id="live">
    <div class="err line" id="warn"></div>
    <div id="transcript"></div>
    <div id="companion"><input id="question" placeholder="Ask Claude about the call" aria-label="Ask Claude about the call"><div id="answer"></div></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
// The menu-bar app's message handler. A normal browser has none.
const bridge = (msg) => window.webkit?.messageHandlers?.aside?.postMessage(msg);
let S = null, prefs = {}, meetingId, lines = null, answerId = null, endTimer = null, asked = null;
const WAITING = '<span class="quiet">Waiting for the first 15 seconds...</span>';

async function api(path, data) {
  const res = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data || {}) });
  const out = await res.json();
  if (!res.ok) throw new Error(out.error || res.statusText);
  return out;
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clockText = (sec) => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
const hidden = (id) => $(id).classList.contains('hidden');
function showError(e) { $('err').textContent = $('err').title = e.message || String(e); }
const idle = () => $('idle').classList.toggle('hidden', !!S?.meeting || !hidden('start') || !hidden('ending'));
const loadPrefs = async () => { prefs = await (await fetch('/api/prefs')).json(); };

// The last lines event is kept, so a snapshot that arrives before the status still shows.
function showLines() {
  const shown = meetingId && lines?.id === meetingId ? lines.lines.slice(-4) : [];
  $('transcript').innerHTML = shown.map((l) => `<p><span class="who">${esc(l.speaker)}</span>${esc(l.text)}</p>`).join('') || WAITING;
}
async function poll() {
  S = await (await fetch('/api/status')).json();
  const m = S.meeting;
  if (m?.id !== meetingId) {
    meetingId = m?.id; answerId = null;
    $('answer').textContent = $('err').textContent = '';
    showLines();
    if (!$('stopBtns').disabled) promptEnding(-1); // during our own Stop, "Writing the notes..." stays until it returns
  }
  $('dot').classList.toggle('on', !!m);
  $('title').textContent = m ? m.title : 'aside';
  $('live').classList.toggle('hidden', !m);
  $('companion').classList.toggle('hidden', m?.claude !== 'allowed');
  $('warn').textContent = $('warn').title = m && S.asrError ? `Speech worker not running (${S.asrError}). The audio is kept; press Finish it later.` : '';
  $('idle').textContent = S.writing ? 'Writing the notes...' : 'Not recording';
  idle();
}
setInterval(() => { $('clock').textContent = S?.meeting ? clockText((Date.now() - S.meeting.startedAt) / 1000) : ''; }, 500);

new EventSource('/api/events').onmessage = (e) => {
  const ev = JSON.parse(e.data);
  if (ev.type === 'lines') { lines = ev; showLines(); }
  if (ev.type === 'answer-start') { answerId = ev.id; $('answer').textContent = ''; }
  if (ev.type === 'answer-delta' && ev.id === answerId) $('answer').textContent += ev.text;
  if (ev.type === 'state') poll().catch(showError);
  if (ev.type === 'prefs') loadPrefs().catch(showError);
  if (ev.type === 'error') showError(new Error(ev.message));
};

function setCollapsed(on) {
  if (document.body.classList.contains('collapsed') === on) return;
  document.body.classList.toggle('collapsed', on);
  bridge({ type: 'panel', collapsed: on });
}
// Collapsed, the whole pill expands the panel.
$('bar').onclick = (e) => { const c = document.body.classList.contains('collapsed'); if (c || e.target.id === 'fold') setCollapsed(!c); };
function focusAsk() { setCollapsed(false); $('question').focus(); }

function promptStart(bundleId, appName) {
  asked = { bundleId, appName };
  $('startText').textContent = `${appName} is using the microphone. Record this meeting?`;
  $('err').textContent = '';
  $('start').classList.remove('hidden');
  setCollapsed(false); idle();
}
for (const b of $('startBtns').querySelectorAll('[data-claude]')) b.onclick = async () => {
  $('err').textContent = ''; $('startBtns').disabled = true;
  try {
    await api('/api/meeting/start', { title: `${asked.appName} call`, claude: b.dataset.claude, app: asked.bundleId, backend: prefs.backend, keepAudio: prefs.keepAudio });
    $('start').classList.add('hidden');
    bridge({ type: 'started' });
  } catch (e) { showError(e); }
  $('startBtns').disabled = false;
  await poll().catch(showError);
};
$('notNow').onclick = () => { $('start').classList.add('hidden'); idle(); bridge({ type: 'dismiss' }); };

// The countdown only informs: at 0:00 the app itself stops the meeting.
function promptEnding(seconds) {
  clearInterval(endTimer);
  $('ending').classList.toggle('hidden', seconds < 0); $('stopBtns').disabled = false; idle();
  if (seconds < 0) return;
  setCollapsed(false);
  const until = Date.now() + seconds * 1000;
  const tick = () => { $('endText').textContent = `Call ended. Stopping in ${clockText(Math.max(0, Math.ceil((until - Date.now()) / 1000)))}`; };
  tick(); endTimer = setInterval(tick, 1000);
}
$('stopNow').onclick = async () => {
  clearInterval(endTimer); $('stopBtns').disabled = true; $('endText').textContent = 'Writing the notes...';
  try { await api('/api/meeting/stop'); } catch (e) { showError(e); }
  promptEnding(-1);
  await poll().catch(showError);
};
$('keep').onclick = () => { promptEnding(-1); bridge({ type: 'keep' }); };

$('question').onkeydown = async (e) => {
  const question = e.target.value.trim();
  if (e.key !== 'Enter' || !question) return;
  e.target.value = '';
  try { await api('/api/meeting/ask', { question }); } catch (err) { showError(err); }
};

poll().catch(showError);
loadPrefs().catch(showError);
</script>
</body>
</html>
